<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ストップウォッチ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>ストップウォッチ</h1>

    <div class="display">
      <span id="minutes">00</span>
      <span class="colon">:</span>
      <span id="seconds">00</span>
      <span class="dot">.</span>
      <span id="milliseconds">00</span>
    </div>

    <div class="controls">
      <button id="startStopBtn" class="btn btn-start">スタート</button>
      <button id="lapBtn" class="btn btn-lap" disabled>ラップ</button>
      <button id="resetBtn" class="btn btn-reset" disabled>リセット</button>
    </div>

    <div class="laps-container">
      <ul id="lapList"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
